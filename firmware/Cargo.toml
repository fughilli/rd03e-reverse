[package]
name = "rd03e-fw"
version = "0.0.0"
edition = "2021"
description = "From-source GD32E230 firmware for the Rd-03E, reverse-engineered to drive the S3KM111L radar and host custom radar algorithms"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rd03e-fw"
test = false
bench = false

# No external crates: the Cortex-M23 runtime (vector table, reset handler,
# panic handler, delay) lives in src/rt.rs so the firmware builds from prebuilt
# `core` alone — no cortex-m / cortex-m-rt / panic-halt, no crate_universe.
# This is what lets fughilli/embedded build it with rules_rust and nothing else.
[dependencies]

[profile.release]
opt-level = "s"     # 64 KB flash; favor size
lto = true
codegen-units = 1
debug = true        # symbols stay in the ELF, stripped from the .bin
overflow-checks = false
panic = "abort"     # no unwinder on bare metal; rt.rs provides the handler
